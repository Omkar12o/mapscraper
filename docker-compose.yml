version: "3.8"

services:
  # Google Maps Scraper (REST API / Web UI) — runs in web mode on port 8080.
  scraper:
    image: gosom/google-maps-scraper:latest
    container_name: lead-finder-scraper
    ports:
      - "8080:8080"
    volumes:
      - gmapsdata:/gmapsdata
    command: ["-web", "-data-folder", "/gmapsdata"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Lead Finder backend (Node/Express) — talks to scraper REST API, owns SQLite.
  backend:
    build: ./backend
    container_name: lead-finder-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SCRAPER_URL=http://scraper:8080
      - SCRAPER_MAX_TIME_SECONDS=300
      - SCRAPER_DEPTH=10
      - SCRAPER_RADIUS=10000
      - MAX_RETRIES=1
      - POLL_INTERVAL_MS=5000
      - CONCURRENCY=3
      - DB_PATH=/data/leadfinder.db
      # Mail Sender (optional) — set these in a root .env file for Docker.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-}
      - MAIL_UNSUBSCRIBE_URL=${MAIL_UNSUBSCRIBE_URL:-}
      - MAIL_DELAY_SECONDS=${MAIL_DELAY_SECONDS:-45}
      - MAIL_DAILY_CAP=${MAIL_DAILY_CAP:-50}
    volumes:
      - leadfinder-data:/data
    depends_on:
      scraper:
        condition: service_healthy
    restart: unless-stopped

  # Lead Finder frontend (React + Vite) — built, then served via nginx on port 5173.
  # nginx proxies /api/* to the backend container, so no build-time API URL is needed.
  frontend:
    build: ./frontend
    container_name: lead-finder-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  gmapsdata:
  leadfinder-data:
